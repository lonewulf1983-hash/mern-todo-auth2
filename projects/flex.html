<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            .container {
                display: flex;
                gap: 20px;
                padding: 20px;
                background: #eee
            }
            .box {
                width: 100px;
                height: 100px;
                background: steelblue;
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </body>
</html>
