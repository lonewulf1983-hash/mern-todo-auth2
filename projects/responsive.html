<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            .card {
                width: 300px;
                padding: 20px;
                background: #fafafa;
                border: 1px solid #ddd;
                border-radius: 8px;
                margin: 20px auto
            }

            @media (max-width: 600px) {
                .card {
                    width: 90%;
                    background: #f0f0f0;
                }
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Responsive Card</h2>
            <p>This card changes size and color on small screens</p>
        </div>
    </body>
</html>
